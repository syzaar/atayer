<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirect</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // الرابط النهائي
        const TARGET_URL = "https://sin3uy.online";

        // التحويل بدون إضافة صفحة GitHub إلى سجل الرجوع
        history.replaceState(null, "", TARGET_URL);

        // منع الرجوع إلى صفحة التحويل
        history.pushState(null, "", TARGET_URL);

        window.addEventListener("popstate", function () {
            history.pushState(null, "", TARGET_URL);
            window.location.replace(TARGET_URL);
        });

        // التحويل الفوري
        window.location.replace(TARGET_URL);
    </script>
</head>

<body>

    <noscript>
        <meta http-equiv="refresh" content="0;url=https://sin3uy.online">
    </noscript>

</body>
</html>
